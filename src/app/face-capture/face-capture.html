<section class="fc" [attr.data-phase]="phase()">
  <header class="fc-header" aria-live="polite">
    <h1 class="fc-title">{{ message() }}</h1>
    <p class="fc-hint">{{ hint() ?? ' ' }}</p>
  </header>

  <div class="fc-stage">
    <video #video class="fc-video" autoplay muted playsinline></video>

    <svg class="fc-mask" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <mask id="fc-oval-hole">
          <rect width="300" height="400" fill="white" />
          <ellipse cx="150" cy="200" rx="105" ry="140" fill="black" />
        </mask>
      </defs>
      <rect width="300" height="400" class="fc-shade" mask="url(#fc-oval-hole)" />
      <ellipse cx="150" cy="200" rx="105" ry="140" class="fc-oval" [class.ok]="faceOk()" />
    </svg>

    @switch (phase()) {
      @case ('loading') {
        <div class="fc-overlay"><span class="fc-spinner"></span></div>
      }
      @case ('processing') {
        <div class="fc-overlay"><span class="fc-spinner"></span></div>
      }
      @case ('done') {
        <div class="fc-overlay fc-done">✓</div>
      }
    }
  </div>

  @if (totalSteps() > 0) {
    <ol class="fc-steps" aria-label="Progreso">
      @for (i of steps(); track i) {
        <li [class.done]="i < step()" [class.current]="i === step()"></li>
      }
    </ol>
  }

  @if (phase() === 'error') {
    <div class="fc-error" role="alert">
      <p>{{ errorMessage() }}</p>
      @if (canRetry()) {
        <button type="button" (click)="retry()">Reintentar</button>
      }
    </div>
  }
</section>
